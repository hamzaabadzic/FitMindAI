<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitMind AI – Tvoj lični AI trener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="FitMind AI Logo">
        <h1>FitMind AI</h1>
        <p class="subtitle">Tvoj lični AI trener za ishranu, trening i zdravlje</p>
    </div>

    <div class="chat-container">
        <div id="chat-box"></div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Napiši nešto..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
